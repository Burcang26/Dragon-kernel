name: Build Gale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Paket
        run: sudo apt-get install -y bc bison flex libssl-dev ccache

      - name: Download Neutron Clang
        run: |
          mkdir clang
          cd clang
          curl -LO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S=240000
          ./antman --patch=glibc
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          make O=out gale_defconfig
          make O=out ARCH=arm64 CC=clang -j$(nproc)

      - name: Bikin Zip Flashable
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master --depth=1
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../gale-kernel-$(date +%d%m%y).zip * -x .git
          
      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: deragon
          path: *.zip
